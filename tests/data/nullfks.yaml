dataset: nullfks

plan_config:
  targets:
    test.a:
      in:
        sample: [1]
  polymorphic_fks:
  - table: test.d
    columns: [x_id]
    discriminator_column: x_t
    destinations:
      b:
        table: test.b
        columns: [id]
      c:
        table: test.c
        columns: [id]
      e:
        table: test.e
        columns: [id]
  select:
  - test.*

sample_config: {}

expected_plan:
  passthrough: []
  queries:
    test.a:
      statement:
        from:
          schema: test
          table: a
        type: select
        where:
          columns:
          - sample
          type: in
          values:
          - - 1
    test.b:
      statement:
        from:
          schema: test
          table: b
        joins:
        - - half_unique: true
            left_columns:
            - a_id
            left_discriminator: []
            right:
              sampled: true
              schema: test
              table: a
            right_columns:
            - id
            right_discriminator: []
        type: select
    test.c:
      statement:
        from:
          schema: test
          table: c
        joins:
        - - half_unique: true
            left_columns:
            - a_id
            left_discriminator: []
            right:
              sampled: true
              schema: test
              table: a
            right_columns:
            - id
            right_discriminator: []
        - - half_unique: true
            left_columns:
            - b_id
            left_discriminator: []
            right:
              sampled: true
              schema: test
              table: b
            right_columns:
            - id
            right_discriminator: []
        type: select
    test.d:
      statement:
        from:
          schema: test
          table: d
        joins:
        - - half_unique: true
            left_columns:
            - a_id
            left_discriminator: []
            right:
              sampled: true
              schema: test
              table: a
            right_columns:
            - id
            right_discriminator: []
        - - half_unique: true
            left_columns:
            - x_id
            left_discriminator:
            - x_t
            - b
            right:
              sampled: true
              schema: test
              table: b
            right_columns:
            - id
            right_discriminator: []
          - half_unique: true
            left_columns:
            - x_id
            left_discriminator:
            - x_t
            - c
            right:
              sampled: true
              schema: test
              table: c
            right_columns:
            - id
            right_discriminator: []
        type: select
    test.e:
      statement:
        from:
          schema: test
          table: e
        joins:
        - - half_unique: true
            left_columns:
            - id
            left_discriminator: []
            right:
              sampled: true
              schema: test
              table: d
            right_columns:
            - x_id
            right_discriminator:
            - x_t
            - e
        type: select


